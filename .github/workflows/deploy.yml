name: deploy

# Manual on purpose: UniBaazar is live, and the team is deliberately building
# the rest of the v2 rebuild locally/in CI before deploying anything for
# real (see docs/decisions/0007-manual-deploy-trigger.md). `ci` still runs
# and packages a release artifact on every push to main; this workflow picks
# a specific already-built, already-green artifact and ships it, only when
# someone explicitly runs it.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Full commit SHA to deploy (must have a successful ci run on main)"
        required: true

jobs:
  find-ci-run:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_id=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow=ci.yml \
            --json headSha,databaseId,conclusion,status \
            --jq "[.[] | select(.headSha==\"${{ inputs.sha }}\" and .status==\"completed\" and .conclusion==\"success\")][0].databaseId")
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "No successful ci run found for ${{ inputs.sha }} — check the Actions tab." >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

  deploy:
    needs: find-ci-run
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Ensure the release/shared directories exist
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # Optional: only needed if the key was generated with a
          # passphrase (some cPanel hosts' "Generate a New Key" form
          # requires one and won't let you leave it blank). Empty when
          # SSH_PASSPHRASE isn't set, which both actions treat as "no
          # passphrase" — safe either way.
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.APP_PATH }}"
            mkdir -p releases shared/uploads shared/backups incoming
            if [ ! -f shared/.env ]; then
              echo "shared/.env is missing — first-time setup isn't finished." >&2
              echo "See DEPLOYMENT.md 'First-time setup' before the first deploy." >&2
              exit 1
            fi

      - name: Download the release artifact built by ci.yml
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.find-ci-run.outputs.run_id }}
          name: release-${{ inputs.sha }}
          path: artifact

      - name: Upload artifact to the host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }} # see the first step's comment
          port: ${{ secrets.SSH_PORT }}
          source: artifact/release.tar.gz
          target: ${{ secrets.APP_PATH }}/incoming
          strip_components: 1

      # tar runs detached, not inside this SSH session. Run in the session, it
      # was SIGKILLed partway through (at 1m14s to 1m50s, even with the app
      # stopped and the account idle), while the same command finished in
      # cPanel's Terminal both times it was tried. The next step polls for the
      # result over short separate connections, so no session has to stay open
      # for the 90 seconds or so the unpack takes on this host's I/O limit.
      - name: Start unpacking the release
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }} # see the first step's comment
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.APP_PATH }}"
            RELEASE_DIR="releases/${{ inputs.sha }}"
            # A re-run starts clean: a previous attempt killed mid-unpack
            # would otherwise leave stale or truncated files behind.
            rm -rf "$RELEASE_DIR" incoming/unpack.status
            mkdir -p "$RELEASE_DIR"
            DETACH=""
            if command -v setsid >/dev/null 2>&1; then DETACH="setsid"; fi
            nohup $DETACH sh -c 'tar -xzf incoming/release.tar.gz -C "$1"; code=$?; if [ "$code" = 0 ]; then rm -f incoming/release.tar.gz; fi; echo "$code" > incoming/unpack.status' sh "$RELEASE_DIR" > incoming/unpack.log 2>&1 < /dev/null &
            echo "Unpack started"

      - name: Wait for the unpack to finish
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          APP_PATH: ${{ secrets.APP_PATH }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          remote() {
            ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" \
              -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
              "$SSH_USER@$SSH_HOST" "$1"
          }
          for _ in $(seq 1 60); do
            sleep 10
            status="$(remote "cat '$APP_PATH/incoming/unpack.status' 2>/dev/null" || true)"
            if [ "$status" = "0" ]; then
              echo "Unpacked"
              exit 0
            fi
            if [ -n "$status" ]; then
              echo "tar exited with status $status" >&2
              remote "cat '$APP_PATH/incoming/unpack.log'" >&2 || true
              exit 1
            fi
          done
          echo "The unpack didn't finish within 10 minutes" >&2
          exit 1

      # Everything past this point — shared-dir symlinks, DB backup,
      # migrations, syncing into the live directory, the restart, the
      # smoke test, and the automatic rollback on failure — lives in
      # scripts/deploy/deploy-release.sh (shipped inside the release
      # itself), so it's version-controlled and testable outside CI.
      # `current` is a real directory synced via rsync on every deploy,
      # not a symlink repointed per deploy — see ADR 0035.
      - name: Migrate, switch, restart, smoke-test (auto-rollback on failure)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }} # see the first step's comment
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 30m # see "Unpack the release" step's comment
          script_stop: true
          envs: SHA,APP_PATH,HEALTH_CHECK_URL
          script: |
            set -euo pipefail
            export SHA="${{ inputs.sha }}"
            export APP_PATH="${{ secrets.APP_PATH }}"
            export HEALTH_CHECK_URL="${{ secrets.HEALTH_CHECK_URL }}"
            bash "$APP_PATH/releases/$SHA/scripts/deploy/deploy-release.sh"
